plugins {
    id 'com.android.application'
}

// Numéro de version : fourni par GitHub Actions (numéro de l'exécution), 1 en local
def buildNumber = (System.getenv('VERSION_CODE') ?: '1') as int

android {
    namespace 'io.github.coemathieuhub.carnet'
    compileSdk 36

    defaultConfig {
        applicationId 'io.github.coemathieuhub.carnet'
        minSdk 24
        targetSdk 35
        versionCode buildNumber
        versionName "1.0.${buildNumber}"
    }

    signingConfigs {
        release {
            // Clé de signature : android/keystore.p12, protégée par le secret KEYSTORE_PASSWORD
            storeFile file(System.getenv('KEYSTORE_FILE') ?: 'keystore-absente.p12')
            storePassword System.getenv('KEYSTORE_PASSWORD')
            keyAlias 'carnet'
            keyPassword System.getenv('KEYSTORE_PASSWORD')
            storeType 'pkcs12'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.androidbrowserhelper:androidbrowserhelper:2.7.4'
    // Déjà embarqué par androidbrowserhelper ; déclaré pour compiler LauncherActivity.java
    implementation 'androidx.browser:browser:1.10.0'
}
