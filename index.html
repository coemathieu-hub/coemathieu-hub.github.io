<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Carnet de voyage</title>
<meta name="description" content="Organisation de voyage en famille : programme, conseils, itinéraire, dépenses partagées et budget.">
<meta name="theme-color" content="#071A2C" media="(prefers-color-scheme: dark)">
<meta name="theme-color" content="#FFF8EE" media="(prefers-color-scheme: light)">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/icon-192.png" type="image/png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon-180.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Carnet de voyage">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.css">
<style>
/* =====================================================================
   CHARTE — thème sombre (inspiré Tricount) et thème clair
   ===================================================================== */
:root{
  --bg:#071A2C;--card:#0F2A44;--card2:#163755;--line:#1C3F60;--line2:#2A5679;
  --text:#F4FAFF;--muted:#A3BBD0;--faint:#7590A8;
  --accent:#0A8396;--accent-text:#5FD8E6;--on-accent:#FFF;
  --grad:linear-gradient(135deg,#0A8396 0%,#1667B8 100%);--sun:#FFB547;--coral:#FF8A6B;
  --green:#4CC38A;--red:#FF6B5E;
  --r3-bg:#FFB547;--r3-fg:#2A1600;--r2-bg:#163755;--r2-fg:#FFC36B;
  --seg-bg:#5FD8E6;--seg-fg:#04202C;--seg-line:#2A5679;
  --info-bg:#0F3250;--info-fg:#C4E9F6;--info-line:#21608E;
  --warn-bg:#3A2A0E;--warn-fg:#FFD68A;
  --ok-bg:#0E3328;--ok-fg:#86E3B9;
  --bad-bg:#3D1A1C;--bad-fg:#FF9C8F;
  --nav-bg:#081E33;--shadow:0 10px 28px rgba(0,0,0,.45);
  --radius:18px;--gap:12px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#FFF8EE;--card:#FFF;--card2:#FCEFDB;--line:#F1E3CC;--line2:#E2CFAE;
  --text:#10283D;--muted:#5D6F80;--faint:#8C9AA8;
  --accent:#0A8396;--accent-text:#08788A;--on-accent:#FFF;
  --grad:linear-gradient(135deg,#0A8396 0%,#1667B8 100%);--sun:#F29A1F;--coral:#E0603F;
  --green:#1E8E4E;--red:#C7362C;
  --r3-bg:#FFB547;--r3-fg:#2A1600;--r2-bg:#FFE6BF;--r2-fg:#7A4A00;
  --seg-bg:#0A8396;--seg-fg:#FFF;--seg-line:#0A8396;
  --info-bg:#E2F5F8;--info-fg:#0B5E6B;--info-line:#B6E3EA;
  --warn-bg:#FFF1D6;--warn-fg:#6B4300;
  --ok-bg:#DDF3E6;--ok-fg:#14663A;
  --bad-bg:#FDE7E5;--bad-fg:#9E2A21;
  --nav-bg:#FFF;--shadow:0 10px 28px rgba(16,40,61,.14);
  color-scheme:light;
}
@media (prefers-color-scheme: light){
  :root[data-theme="auto"]{
    --bg:#FFF8EE;--card:#FFF;--card2:#FCEFDB;--line:#F1E3CC;--line2:#E2CFAE;
    --text:#10283D;--muted:#5D6F80;--faint:#8C9AA8;
    --accent:#0A8396;--accent-text:#08788A;--on-accent:#FFF;
    --grad:linear-gradient(135deg,#0A8396 0%,#1667B8 100%);--sun:#F29A1F;--coral:#E0603F;
    --green:#1E8E4E;--red:#C7362C;
    --r3-bg:#FFB547;--r3-fg:#2A1600;--r2-bg:#FFE6BF;--r2-fg:#7A4A00;
    --seg-bg:#0A8396;--seg-fg:#FFF;--seg-line:#0A8396;
    --info-bg:#E2F5F8;--info-fg:#0B5E6B;--info-line:#B6E3EA;
    --warn-bg:#FFF1D6;--warn-fg:#6B4300;
    --ok-bg:#DDF3E6;--ok-fg:#14663A;
    --bad-bg:#FDE7E5;--bad-fg:#9E2A21;
    --nav-bg:#FFF;--shadow:0 10px 28px rgba(16,40,61,.14);
    color-scheme:light;
  }
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--text)}
body{font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;font-size:15px;line-height:1.4;-webkit-text-size-adjust:100%;overscroll-behavior-y:none}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
h1,h2,h3{margin:0}
.hidden{display:none!important}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
/* --- structure : fluide, de 320 px au grand écran --- */
#shell{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column}
#app{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:0 12px calc(84px + env(safe-area-inset-bottom))}
.topbar{position:sticky;top:0;z-index:20;background:var(--bg);display:flex;align-items:center;gap:6px;padding:calc(8px + env(safe-area-inset-top)) 0 8px;min-height:56px}
.topbar .title{flex:1;min-width:0}
.topbar .title b{display:block;font-size:17px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.topbar .title span{display:block;font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.iconbtn{width:44px;height:44px;flex:0 0 44px;border:0;border-radius:12px;background:none;color:var(--text);display:inline-flex;align-items:center;justify-content:center;cursor:pointer;text-decoration:none}
.iconbtn:active{background:var(--card2)}
.ico{width:22px;height:22px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex:0 0 auto}
.ico.s{width:16px;height:16px}
h1.big{font-size:24px;font-weight:700;margin:6px 4px 12px}
.lbl{font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);font-weight:600;margin:0}
.muted{color:var(--muted)}.small{font-size:13px}.tiny{font-size:11.5px}
.stack{display:flex;flex-direction:column;gap:var(--gap)}
.row{display:flex;align-items:center;gap:10px}
.row.wrap{flex-wrap:wrap}
.grow{flex:1;min-width:0}
.card{background:var(--card);border-radius:var(--radius);padding:14px 16px}
.card.tight{padding:10px 12px}
.card.info{background:var(--info-bg);color:var(--info-fg);border:1px solid var(--info-line)}
.card.warn{background:var(--warn-bg);color:var(--warn-fg)}
.card.ok{background:var(--ok-bg);color:var(--ok-fg)}
.card.bad{background:var(--bad-bg);color:var(--bad-fg)}
.card.accent{border:1px solid var(--info-line)}
.card.r3line{border:1px solid #5C4A1E}
.sec-h{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px;margin:4px 4px 8px}
.sec-h h2{white-space:nowrap}
.sec-h .chips{flex-wrap:nowrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 16px;border-radius:12px;border:1px solid var(--line2);background:none;color:var(--text);font-weight:500;cursor:pointer;text-decoration:none;text-align:center}
.btn.primary{background:var(--grad);border-color:transparent;color:var(--on-accent);font-weight:600;box-shadow:0 4px 14px rgba(10,131,150,.28)}
.btn.ghost{border-color:transparent;color:var(--accent-text)}
.btn.dashed{border-style:dashed;color:var(--accent-text)}
.btn.danger{border-color:var(--red);color:var(--red)}
.btn.okb{background:var(--ok-bg);border-color:transparent;color:var(--ok-fg)}
.btn.block{display:flex;width:100%}
.btn.sm{min-height:34px;padding:0 10px;border-radius:9px;font-size:13px}
.btn:disabled{opacity:.5}
.chip{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;background:var(--card2);font-size:12.5px;color:var(--text);white-space:nowrap;border:0}
button.chip{min-height:32px;cursor:pointer}
.chip.on{background:var(--seg-bg);color:var(--seg-fg)}
.chip.okc{background:var(--ok-bg);color:var(--ok-fg)}
.chip.warnc{background:var(--warn-bg);color:var(--warn-fg)}
.chip.badc{background:var(--bad-bg);color:var(--bad-fg)}
.chip.infoc{background:var(--info-bg);color:var(--info-fg)}
.chips{display:flex;flex-wrap:wrap;gap:6px}
/* --- scènes de vacances (SVG) --- */
.scene{position:relative;overflow:hidden;border-radius:22px;color:#fff;text-decoration:none;display:block;isolation:isolate}
.scene>svg{position:absolute;inset:0;width:100%;height:100%;z-index:-2}
.scene::after{content:"";position:absolute;inset:0;z-index:-1;background:linear-gradient(180deg,rgba(4,20,36,0) 30%,rgba(4,20,36,.55) 100%)}
.scene .sc-in{position:relative;padding:16px 18px;text-shadow:0 1px 3px rgba(0,0,0,.45)}
.tripban{min-height:118px;display:flex;align-items:flex-end;margin-bottom:12px}
.tripban .sc-in{width:100%}
.tripban b{display:block;font-size:22px;font-weight:800;line-height:1.15}
.tripban span{font-size:13.5px;opacity:.95}
/* --- accueil --- */
.hello{min-height:150px;display:flex;align-items:flex-end;margin-top:4px}.hello h1{font-size:27px;line-height:1.15;margin:0;font-weight:800}.hello p{margin:4px 0 0;font-size:15px;opacity:.95}
.hero{display:flex;gap:14px;align-items:flex-end;min-height:150px;padding:18px;box-shadow:var(--shadow);text-shadow:0 1px 3px rgba(0,0,0,.5)}
.hero-emoji{font-size:44px;line-height:1;flex:none;filter:drop-shadow(0 2px 6px rgba(0,0,0,.25))}
.hero-k{font-size:12px;letter-spacing:.06em;text-transform:uppercase;opacity:.85;font-weight:600}
.hero-t{font-size:21px;font-weight:700;line-height:1.2;margin-top:2px}
.hero-s{font-size:14px;opacity:.9;margin-top:2px}
.hero-n{flex:none;text-align:right;z-index:1}.hero-n b{display:block;font-size:26px;font-weight:800;white-space:nowrap}.hero-n span{font-size:12px;opacity:.9}
.hero-bar{height:6px;border-radius:3px;background:rgba(255,255,255,.3);margin-top:10px;overflow:hidden}.hero-bar i{display:block;height:100%;background:#fff;border-radius:3px}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.tile{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:14px;border-radius:18px;background:var(--card);border:0;color:inherit;text-decoration:none;text-align:left;font:inherit;cursor:pointer;min-height:96px}
.tile .ti{width:38px;height:38px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px}
.tile b{font-size:15px}.tile span.s{font-size:12.5px;color:var(--muted);line-height:1.3}
.tile.primary{background:var(--grad);color:var(--on-accent)}.tile.primary span.s{color:rgba(255,255,255,.85)}
.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.kpi{background:var(--card);border-radius:14px;padding:10px 4px;text-align:center;min-width:0}.kpi b{display:block;font-size:clamp(14px,4.6vw,20px);font-weight:700;white-space:nowrap}.kpi span{font-size:11.5px;color:var(--muted)}
.year{font-size:13px;font-weight:700;color:var(--muted);letter-spacing:.05em;margin:14px 6px 6px}
.hist{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--card);color:inherit;text-decoration:none}
.hist+.hist{margin-top:8px}
.hist-e{width:52px;height:52px;flex:none;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:24px;background:var(--card2);position:relative;overflow:hidden;isolation:isolate}
.hist-e>svg{position:absolute;inset:0;width:100%;height:100%;z-index:-1}
.hist-a{flex:none;text-align:right;font-weight:600;font-size:14px}.hist-a span{display:block;font-size:11.5px;color:var(--muted);font-weight:400}
@media (min-width:640px){.tiles{grid-template-columns:repeat(4,minmax(0,1fr))}}
label.chip{white-space:normal;max-width:100%;height:auto;line-height:1.3;padding-top:6px;padding-bottom:6px}
.ac{position:relative}
.ac-list{position:absolute;left:0;right:0;top:calc(100% + 4px);z-index:40;background:var(--card);border:1px solid var(--line2);border-radius:12px;box-shadow:0 10px 28px rgba(0,0,0,.28);max-height:min(340px,50vh);overflow:auto}
.ac-item{display:flex;gap:10px;align-items:baseline;width:100%;padding:11px 12px;border:0;border-bottom:1px solid var(--line);background:none;color:inherit;text-align:left;font-size:15px;cursor:pointer}
.ac-item:last-child{border-bottom:0}.ac-item:hover,.ac-item.on{background:var(--card2)}
.ac-item b{min-width:40px;color:var(--accent);font-variant-numeric:tabular-nums}
.ac-empty{padding:11px 12px;font-size:14px;color:var(--muted)}
.ac-hint{margin-top:4px;min-height:1.2em}
.r{display:inline-block;white-space:nowrap;min-width:34px;text-align:center;border-radius:6px;padding:2px 6px;font-size:13px;font-weight:700;line-height:1.3}
.r3{background:var(--r3-bg);color:var(--r3-fg)}
.r2{background:var(--r2-bg);color:var(--r2-fg)}
.r1{background:var(--card2);color:var(--text)}
.r0{border:1px dashed var(--faint);color:var(--muted);font-weight:500;font-size:11px;min-width:0}
.verif{color:var(--r3-bg);font-weight:600}
:root[data-theme="light"] .verif{color:#8A5A00}
@media (prefers-color-scheme: light){:root[data-theme="auto"] .verif{color:#8A5A00}}
.seg{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);border:1px solid var(--seg-line);border-radius:12px;overflow:hidden}
.seg>*{display:flex;align-items:center;justify-content:center;min-height:42px;padding:0 4px;color:var(--text);text-decoration:none;font-weight:500;font-size:14px;border:0;background:none;cursor:pointer;white-space:nowrap}
.seg>*+*{border-left:1px solid var(--seg-line)}
.seg>[aria-selected="true"],.seg>.on{background:var(--seg-bg);color:var(--seg-fg)}
.stats{display:grid;grid-auto-flow:column;grid-auto-columns:minmax(0,1fr);gap:6px;text-align:center}
.stat{background:var(--card2);border-radius:10px;padding:8px 4px}
.stat b{display:block;font-weight:700;font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stat span{font-size:11.5px;color:var(--muted)}
.list{display:flex;flex-direction:column;gap:8px}
.item{display:flex;align-items:center;gap:12px;background:var(--card);border-radius:var(--radius);padding:12px 14px;color:var(--text);text-decoration:none;border:0;width:100%;text-align:left;cursor:pointer}
.item .t{font-weight:500}
.item .s{font-size:13px;color:var(--muted)}
.amt{font-weight:700;font-variant-numeric:tabular-nums;white-space:nowrap}
.pos{color:var(--green)}.neg{color:var(--red)}
.cat{width:40px;height:40px;border-radius:10px;display:flex;align-items:center;justify-content:center;flex:0 0 40px}
.av{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:700;flex:0 0 40px;background:#D9D9DE;color:#444}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);display:inline-block}
/* --- formulaires --- */
.field{display:flex;flex-direction:column;gap:6px}
.field>label,.field>.lab{font-size:13px;color:var(--muted);font-weight:500}
.input,select.input,textarea.input{width:100%;min-height:46px;padding:10px 12px;border-radius:12px;border:1px solid var(--line2);background:var(--card);color:var(--text);font-size:16px}
textarea.input{min-height:96px;resize:vertical}
.input:focus{outline:2px solid var(--accent);outline-offset:0;border-color:transparent}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:359px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.check{display:flex;align-items:flex-start;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.check:first-of-type{border-top:0}
.box{width:24px;height:24px;flex:0 0 24px;border:2px solid var(--faint);border-radius:7px;background:none;padding:0;display:flex;align-items:center;justify-content:center;color:var(--on-accent);cursor:pointer}
.box.on{background:var(--accent);border-color:var(--accent)}
.done{color:var(--muted);text-decoration:line-through}
.org{font-size:11.5px;color:var(--muted)}
.switch{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 0;border-top:1px solid var(--line)}
.switch:first-child{border-top:0}
/* --- programme --- */
.tl{display:flex;flex-direction:column}
.tl-row{display:flex;align-items:baseline;gap:0}
.tl-time{width:50px;flex:0 0 50px;font-weight:600;font-variant-numeric:tabular-nums}
.tl-route{display:flex;align-items:center;gap:8px;margin-left:50px;padding:6px 0 6px 12px;border-left:2px dotted var(--line2);color:var(--muted);font-size:13px;flex-wrap:wrap}
.tl-block{margin:8px 0 4px 50px;padding:8px 12px;border-radius:10px;background:var(--info-bg);color:var(--info-fg);font-size:13px}
.tl-block.warn{background:var(--warn-bg);color:var(--warn-fg)}
.maps{display:inline-flex;align-items:center;gap:4px;margin-left:auto;padding:4px 10px;border-radius:999px;border:1px solid var(--line2);color:var(--accent-text);font-size:12.5px;text-decoration:none;white-space:nowrap}
.step{display:flex;flex-direction:column;gap:8px}
.step .hd{display:flex;align-items:center;gap:10px}
.handle{touch-action:none;cursor:grab;color:var(--faint);width:36px;height:44px;display:flex;align-items:center;justify-content:center;flex:0 0 36px;margin:-8px -6px -8px -8px}
.dragging{opacity:.9;box-shadow:var(--shadow);position:relative;z-index:5}
.drop-ph{border:2px dashed var(--accent);border-radius:var(--radius);min-height:56px}
.alt{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;background:var(--card2);font-size:13px}
.banner{display:flex;gap:10px;align-items:center;padding:10px 14px;border-radius:12px;background:var(--warn-bg);color:var(--warn-fg);font-size:14px}
.map{height:260px;border-radius:12px;overflow:hidden;background:var(--card2)}
.map-fallback{width:100%;height:auto;display:block;border-radius:12px;background:var(--card2)}
/* --- navigation --- */
.nav{position:fixed;left:0;right:0;bottom:0;z-index:30;display:flex;justify-content:center;background:var(--nav-bg);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.nav-in{display:flex;width:100%;max-width:640px}
.nav a{flex:1;display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 0 9px;color:var(--muted);text-decoration:none;font-size:11.5px;min-width:0}
.nav a[aria-current="page"]{color:var(--coral);font-weight:600}
.fab{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(76px + env(safe-area-inset-bottom));z-index:25;display:flex;align-items:center;gap:8px;height:52px;padding:0 22px;border-radius:26px;background:var(--accent);color:var(--on-accent);font-weight:600;border:0;box-shadow:0 0 0 6px var(--bg);cursor:pointer;text-decoration:none;white-space:nowrap}
/* --- feuilles (modales) --- */
#sheet-wrap{position:fixed;inset:0;z-index:50;display:flex;align-items:flex-end;justify-content:center;background:rgba(0,0,0,.55)}
#sheet{width:100%;max-width:640px;max-height:92vh;max-height:92dvh;overflow:auto;background:var(--bg);border-radius:22px 22px 0 0;padding:10px 16px calc(16px + env(safe-area-inset-bottom));box-shadow:var(--shadow)}
#sheet .grab{width:40px;height:4px;border-radius:2px;background:var(--line2);margin:0 auto 10px}
@media (min-width:700px){#sheet-wrap{align-items:center}#sheet{border-radius:22px;max-height:86vh}}
.keypad{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:6px}
.keypad button{height:48px;border-radius:10px;border:0;background:var(--card2);color:var(--text);font-size:20px;font-weight:500;cursor:pointer}
.bigamt{font-size:38px;font-weight:700;font-variant-numeric:tabular-nums;border:0;background:none;width:100%;color:var(--text);padding:4px;border-bottom:2px solid var(--accent);border-radius:0}
.catgrid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.catgrid button{display:flex;flex-direction:column;align-items:center;gap:4px;padding:8px 2px;border-radius:12px;border:1px solid var(--line);background:var(--card);color:var(--text);font-size:11.5px;cursor:pointer;min-height:58px}
.catgrid button.on{border-color:var(--r3-bg);outline:1px solid var(--r3-bg)}
#toast{position:fixed;left:50%;bottom:calc(140px + env(safe-area-inset-bottom));transform:translateX(-50%);z-index:60;background:var(--text);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14px;max-width:calc(100% - 32px);box-shadow:var(--shadow)}
.syncb{display:inline-flex;align-items:center;gap:5px;padding:4px 10px;border-radius:999px;font-size:12px;white-space:nowrap;border:0;cursor:pointer}
.bar{height:8px;border-radius:4px;background:var(--card2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent-text);border-radius:4px}
.bar.pos>i{background:var(--green)}.bar.neg>i{background:var(--red)}
.table{width:100%;border-collapse:collapse;font-size:14px}
.table th{font-size:12px;color:var(--muted);font-weight:500;text-align:left;padding:6px 4px}
.table td{padding:8px 4px;border-top:1px solid var(--line);vertical-align:top}
.table .n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.scrollx{overflow-x:auto}
.photos{display:grid;grid-template-columns:repeat(auto-fill,minmax(96px,1fr));gap:6px}
.photos img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:10px;display:block}
.qr svg,.qr img{width:200px;height:200px;background:#fff;padding:8px;border-radius:12px}
pre.code{white-space:pre-wrap;word-break:break-word;background:var(--card2);padding:12px;border-radius:12px;font-size:12px;max-height:260px;overflow:auto}
.drop{border:2px dashed var(--line2);border-radius:14px;padding:18px;text-align:center;color:var(--muted)}
.drop.over{border-color:var(--accent);color:var(--accent-text)}
/* --- grands écrans (Z Fold déplié, tablette, ordinateur) --- */
@media (min-width:640px){
  .two{display:grid;grid-template-columns:minmax(220px,280px) minmax(0,1fr);gap:14px;align-items:start}
  .two>.side{position:sticky;top:64px}
  .cols2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;align-items:start}
  .map{height:320px}
}
@media (max-width:639px){.two>.side.hide-narrow,.two>.main.hide-narrow{display:none}}
@media (min-width:1000px){
  #app{padding-bottom:40px;padding-left:96px}
  .nav{top:0;bottom:0;right:auto;width:84px;flex-direction:column;justify-content:flex-start;border-top:0;border-right:1px solid var(--line);padding-top:16px}
  .nav-in{flex-direction:column}
  .fab{left:auto;right:32px;transform:none;bottom:32px}
}
/* --- impression (PDF) --- */
@media print{
  :root{--bg:#fff;--card:#fff;--card2:#f3f3f3;--text:#111;--muted:#555;--line:#ddd;--line2:#ccc;color-scheme:light}
  .nav,.fab,.topbar .iconbtn,.noprint,#toast{display:none!important}
  #app{max-width:none;padding:0}
  .card{border:1px solid #ddd;break-inside:avoid}
  .pagebreak{break-before:page}
  a{color:#111;text-decoration:none}
}
</style>
</head>

<body>

</div>

<div id="toast" class="hidden" role="status"></div>
<noscript><p style="padding:24px">Cette application a besoin de JavaScript.</p></noscript>
<script type="module">

/* =====================================================================
   0. CONFIGURATION — bloc isolé, seul endroit à modifier
   ---------------------------------------------------------------------
   FIREBASE_CONFIG : configuration web du projet Firebase (pas un secret :
   la sécurité repose sur les règles Firestore). Laisser null pour
   fonctionner en mode « local » (sans synchro). Elle peut aussi être
   collée depuis Réglages → Synchro cloud, ou arriver par un lien
   d'invitation.
   ===================================================================== */
const FIREBASE_CONFIG = null;
const APP_VERSION = '1.3.0';
const APP_URL = 'https://coemathieu-hub.github.io/';
const APK_URL = 'https://github.com/coemathieu-hub/coemathieu-hub.github.io/releases/latest/download/carnet-de-voyage.apk';

/* Bibliothèques externes — versions figées (mises en cache hors ligne par sw.js) */
const LIBS = {
  firebase: 'https://www.gstatic.com/firebasejs/12.19.0/',
  leaflet: 'https://cdn.jsdelivr.net/npm/leaflet@1.9.4/dist/leaflet.js',
  qrcode: 'https://cdn.jsdelivr.net/npm/qrcode-generator@2.0.4/dist/qrcode.mjs',
  pdfjs: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.min.mjs',
  pdfjsWorker: 'https://cdn.jsdelivr.net/npm/pdfjs-dist@6.3.289/build/pdf.worker.min.mjs',
  docx: 'https://cdn.jsdelivr.net/npm/docx@9.8.1/dist/index.iife.js',
  postalMime: 'https://cdn.jsdelivr.net/npm/postal-mime@4.0.3/+esm',
  msgreader: 'https://cdn.jsdelivr.net/npm/@kenjiuno/msgreader@1.28.0/+esm',
  xlsx: 'https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js',
  anthropic: 'https://cdn.jsdelivr.net/npm/@anthropic-ai/sdk@0.133.0/+esm',
};

/* Services publics sans clé (conditions d'usage : voir README) */
const SERVICES = {
  tiles: 'https://tile.openstreetmap.org/{z}/{x}/{y}.png',
  osrm: ['https://routing.openstreetmap.de/routed-car/route/v1/driving/', 'https://router.project-osrm.org/route/v1/driving/'],
  nominatim: 'https://nominatim.openstreetmap.org/search',
  meteo: 'https://api.open-meteo.com/v1/forecast',
  taux: ['https://api.frankfurter.app/latest', 'https://api.frankfurter.dev/v1/latest'],
};

/* Règles Firestore (copie de firestore.rules, affichée dans Réglages pour les coller dans la console) */
const RULES_TEXT = "rules_version = '2';\n// Règles de sécurité du Carnet de voyage.\n// Un voyage n'est lisible et modifiable que par ses membres.\n// On devient membre en présentant le code secret du lien d'invitation.\nservice cloud.firestore {\n  match /databases/{database}/documents {\n\n    function signedIn() { return request.auth != null; }\n    function tripPath(tripId) { return /databases/$(database)/documents/trips/$(tripId); }\n    function isMember(tripId) { return signedIn() && exists(/databases/$(database)/documents/trips/$(tripId)/members/$(request.auth.uid)); }\n    function isOwner(tripId) { return signedIn() && get(tripPath(tripId)).data.ownerUid == request.auth.uid; }\n    // Miniature de photo limitée (~330 Ko d'image encodée)\n    function thumbOk(coll) { return coll != 'photos' || request.resource.data.get('thumb', '').size() < 450000; }\n\n    // Liste personnelle de mes voyages\n    match /userTrips/{uid} {\n      allow read, write: if signedIn() && request.auth.uid == uid;\n    }\n\n    match /trips/{tripId} {\n      allow create: if signedIn() && request.resource.data.ownerUid == request.auth.uid;\n      allow read: if isMember(tripId);\n      // Seul le créateur change le propriétaire ou le lien d'invitation\n      allow update: if isMember(tripId)\n        && request.resource.data.ownerUid == resource.data.ownerUid\n        && (request.resource.data.get('inviteToken', '') == resource.data.get('inviteToken', '') || isOwner(tripId));\n      allow delete: if isOwner(tripId);\n\n      match /members/{uid} {\n        allow read: if isMember(tripId);\n        // Rejoindre : créer SON propre document membre avec le bon code,\n        // ou être le créateur du voyage (lors de sa création).\n        allow create: if signedIn() && request.auth.uid == uid\n          && request.resource.data.role in ['member', 'owner']\n          && (getAfter(tripPath(tripId)).data.ownerUid == request.auth.uid\n              || (request.resource.data.role == 'member'\n                  && request.resource.data.token == get(tripPath(tripId)).data.inviteToken));\n        // Chacun modifie son nom / son voyageur, sans changer son rôle\n        allow update: if signedIn() && request.auth.uid == uid && request.resource.data.role == resource.data.role;\n        // Exclure (créateur) ou quitter (soi-même)\n        allow delete: if isOwner(tripId) || (signedIn() && request.auth.uid == uid);\n      }\n\n      // Historique : on ne peut qu'ajouter des lignes, à son nom\n      match /history/{id} {\n        allow read: if isMember(tripId);\n        allow create: if isMember(tripId) && request.resource.data.by == request.auth.uid;\n        allow delete: if isOwner(tripId);\n      }\n\n      // Données du voyage\n      match /{coll}/{id} {\n        allow read: if isMember(tripId);\n        allow create, update: if isMember(tripId) && thumbOk(coll)\n          && coll in ['travelers', 'days', 'steps', 'tips', 'expenses', 'bookings', 'photos', 'checklist'];\n        // Suppression définitive (vider la corbeille) : créateur seulement\n        allow delete: if isOwner(tripId)\n          && coll in ['travelers', 'days', 'steps', 'tips', 'expenses', 'bookings', 'photos', 'checklist'];\n      }\n    }\n  }\n}\n";

// @@CORE-START
/* =====================================================================
   1. CŒUR MÉTIER — fonctions pures, sans DOM (testées sous Node)
   ===================================================================== */

/* ---------- 1.1 Référentiels ---------- */
const SCHEMA = 'carnet/1';

/* Catégories : structure des récaps budgétaires Word */
const CATEGORIES = [
  { k: 'vol', l: 'Vol', ic: 'plane' },
  { k: 'trajet', l: 'Trajet domicile-aéroport', ic: 'car' },
  { k: 'parking_aeroport', l: 'Parking aéroport', ic: 'parking' },
  { k: 'logement', l: 'Logement', ic: 'home' },
  { k: 'voiture', l: 'Location voiture', ic: 'key' },
  { k: 'carburant', l: 'Carburant / recharge', ic: 'fuel' },
  { k: 'parking', l: 'Parking sur place', ic: 'parking' },
  { k: 'restaurants', l: 'Restaurants', ic: 'food' },
  { k: 'courses', l: 'Courses', ic: 'cart' },
  { k: 'loisirs', l: 'Entrées et loisirs', ic: 'ticket' },
  { k: 'souvenirs', l: 'Souvenirs', ic: 'gift' },
  { k: 'divers', l: 'Divers', ic: 'dots' },
];
const CAT = Object.fromEntries(CATEGORIES.map(c => [c.k, c]));

const STEP_TYPES = [
  { k: 'visite', l: 'Visite' }, { k: 'rando', l: 'Rando' }, { k: 'balade', l: 'Balade' },
  { k: 'plage', l: 'Plage' }, { k: 'panorama', l: 'Panorama' }, { k: 'resto', l: 'Resto' },
  { k: 'musee', l: 'Musée / aquarium' }, { k: 'piscine', l: 'Piscine / repos' },
  { k: 'village', l: 'Village' }, { k: 'trajet', l: 'Trajet / logistique' },
];
const STEP_TYPE = Object.fromEntries(STEP_TYPES.map(t => [t.k, t]));
/* Durée sur place par défaut (min) quand rien n'est saisi — affichée « par défaut » */
const DEFAULT_DUREE = { visite: 90, rando: 90, balade: 60, plage: 120, panorama: 30, resto: 75, musee: 90, piscine: 120, village: 90, trajet: 0 };
const STATUTS = [
  { k: 'prevu', l: 'Prévu' }, { k: 'fait', l: 'Fait' },
  { k: 'pas-le-temps', l: 'Pas eu le temps' }, { k: 'abandonne', l: 'Abandonné' },
];
const STATUT = Object.fromEntries(STATUTS.map(s => [s.k, s]));

/* Réglages par défaut (tous modifiables par voyage) */
const DEFAULT_SETTINGS = {
  margeTrajet: 20,        // % ajouté aux temps de route estimés (sans trafic)
  margeAeroport: 120,     // min avant le vol
  pauseEnfants: 15,       // min de pause sur le trajet vers l'aéroport
  navetteMin: 10,         // parking → terminal
  bagagesMin: 30,         // attente bagages à l'arrivée
  retourVoitureMin: 30,   // rendre la voiture de location
  debutJournee: '09:00', finJournee: '19:00', dejeuner: '12:30',
  siesteDebut: '13:00', siesteFin: '15:00',
  ageSieste: 4,           // sieste / poussette / porte-bébé : plus jeune enfant de moins de N ans
  ageEnfantDefaut: 12,    // tarif enfant jusqu'à N ans si l'étape ne précise rien
  seuilRoutine: 70,       // % des jours pleins au-delà duquel un conseil passe en « routine »
  entreEtapes: 15,        // marge entre deux étapes (min)
  maxConseils: 8,
};

const GOUTS = [
  { k: 'randos', l: 'Randos' }, { k: 'balades', l: 'Balades' }, { k: 'visites', l: 'Visites' },
  { k: 'plages', l: 'Plages' }, { k: 'villages', l: 'Villages' }, { k: 'panoramas', l: 'Panoramas' },
  { k: 'nature', l: 'Nature hors sentiers battus (faisable avec de jeunes enfants)' },
  { k: 'piscine', l: 'Piscine et temps calme' },
];

/* Aéroports : fuseaux horaires IANA (faits géographiques, pas des infos pratiques) */
const AIRPORTS = {
  GVA: ['Genève', 'Europe/Zurich'], LYS: ['Lyon Saint-Exupéry', 'Europe/Paris'], BSL: ['Bâle-Mulhouse', 'Europe/Paris'],
  ORY: ['Paris-Orly', 'Europe/Paris'], CDG: ['Paris-CDG', 'Europe/Paris'],
  ACE: ['Lanzarote (Arrecife)', 'Atlantic/Canary'], FUE: ['Fuerteventura', 'Atlantic/Canary'], LPA: ['Gran Canaria', 'Atlantic/Canary'],
  TFS: ['Tenerife Sud', 'Atlantic/Canary'], TFN: ['Tenerife Nord', 'Atlantic/Canary'],
  BRI: ['Bari', 'Europe/Rome'], BDS: ['Brindisi', 'Europe/Rome'], NAP: ['Naples', 'Europe/Rome'], FCO: ['Rome Fiumicino', 'Europe/Rome'],
  CTA: ['Catane', 'Europe/Rome'], PMO: ['Palerme', 'Europe/Rome'], CAG: ['Cagliari', 'Europe/Rome'], OLB: ['Olbia', 'Europe/Rome'],
  MAD: ['Madrid', 'Europe/Madrid'], BCN: ['Barcelone', 'Europe/Madrid'], PMI: ['Palma', 'Europe/Madrid'],
  LIS: ['Lisbonne', 'Europe/Lisbon'], OPO: ['Porto', 'Europe/Lisbon'], FAO: ['Faro', 'Europe/Lisbon'], FNC: ['Madère (Funchal)', 'Atlantic/Madeira'],
  KEF: ['Reykjavik-Keflavik', 'Atlantic/Reykjavik'], OSL: ['Oslo', 'Europe/Oslo'], BGO: ['Bergen', 'Europe/Oslo'], TOS: ['Tromsø', 'Europe/Oslo'],
  TIA: ['Tirana', 'Europe/Tirane'], ATH: ['Athènes', 'Europe/Athens'], HER: ['Héraklion', 'Europe/Athens'],
  VIE: ['Vienne', 'Europe/Vienna'], BUD: ['Budapest', 'Europe/Budapest'], RAK: ['Marrakech', 'Africa/Casablanca'],
  DSS: ['Dakar', 'Africa/Dakar'], ZNZ: ['Zanzibar', 'Africa/Dar_es_Salaam'],
  LAX: ['Los Angeles', 'America/Los_Angeles'], SFO: ['San Francisco', 'America/Los_Angeles'], LAS: ['Las Vegas', 'America/Los_Angeles'],
  BOG: ['Bogota', 'America/Bogota'], CUN: ['Cancún', 'America/Cancun'], MEX: ['Mexico', 'America/Mexico_City'],
};
const HOME_AIRPORTS = ['GVA', 'LYS', 'BSL', 'ORY', 'CDG'];

/* ---------- 1.2 Utilitaires et formats français ---------- */
const pad2 = n => String(n).padStart(2, '0');
function newId(n = 20) {
  const a = 'abcdefghijkmnopqrstuvwxyzABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const r = crypto.getRandomValues(new Uint8Array(n));
  let s = ''; for (const x of r) s += a[x % a.length]; return s;
}
function esc(s) {
  return String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
}
function norm(s) {
  return String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[^a-z0-9]+/g, ' ').trim();
}
const NF2 = new Intl.NumberFormat('fr-FR', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
const NF0 = new Intl.NumberFormat('fr-FR', { maximumFractionDigits: 0 });
/* 111600 → « 1 116,00 € » */
function fmtMoney(cents, cur = 'EUR') {
  if (cents == null || Number.isNaN(cents)) return '—';
  const s = NF2.format(cents / 100);
  return s + ' ' + (cur === 'EUR' ? '€' : cur);
}
/* 419200 → « 4 192 € » (sans centimes s'ils sont nuls) */
function fmtMoneyShort(cents, cur = 'EUR') {
  if (cents == null || Number.isNaN(cents)) return '—';
  if (cents % 100 === 0) return NF0.format(cents / 100) + ' ' + (cur === 'EUR' ? '€' : cur);
  return fmtMoney(cents, cur);
}
function fmtSigned(cents, cur = 'EUR') {
  if (!cents) return fmtMoney(0, cur);
  return (cents > 0 ? '+' : '−') + fmtMoney(Math.abs(cents), cur);
}
/* « 9,50 € », « 1 116,00 », « 16.75 », 16.75 → centimes (entier) ou null */
function parseAmount(v) {
  if (v == null || v === '') return null;
  if (typeof v === 'number') return Number.isFinite(v) ? Math.round(v * 100) : null;
  let s = String(v).replace(/[\s  €$£]|EUR|eur|euros?/g, '').trim();
  if (!s) return null;
  if (s.includes(',') && s.includes('.')) {
    if (s.lastIndexOf(',') > s.lastIndexOf('.')) s = s.replace(/\./g, '').replace(',', '.');
    else s = s.replace(/,/g, '');
  } else s = s.replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(s)) return null;
  return Math.round(parseFloat(s) * 100);
}
function centsToInput(c) { return c == null ? '' : NF2.format(c / 100).replace(/ | /g, ''); }

/* Dates : chaînes ISO « AAAA-MM-JJ », calculées en UTC (pas de piège heure d'été) */
function d2ms(d) { const [y, m, dd] = d.split('-').map(Number); return Date.UTC(y, m - 1, dd); }
function ms2d(ms) { const x = new Date(ms); return x.getUTCFullYear() + '-' + pad2(x.getUTCMonth() + 1) + '-' + pad2(x.getUTCDate()); }
function addDays(d, n) { return ms2d(d2ms(d) + n * 864e5); }
function daysBetween(a, b) { return Math.round((d2ms(b) - d2ms(a)) / 864e5); }
function dateRange(a, b) { const out = []; if (!a || !b || a > b) return out; for (let d = a; d <= b && out.length < 400; d = addDays(d, 1)) out.push(d); return out; }
function isISODate(s) { return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !Number.isNaN(d2ms(s)); }
const JOURS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];
const JOURS_C = ['dim.', 'lun.', 'mar.', 'mer.', 'jeu.', 'ven.', 'sam.'];
const MOIS = ['janvier', 'février', 'mars', 'avril', 'mai', 'juin', 'juillet', 'août', 'septembre', 'octobre', 'novembre', 'décembre'];
function weekday(d) { return new Date(d2ms(d)).getUTCDay(); }
/* « mercredi 12 août » / « mer. 12 août » / option année */
function fmtDay(d, o = {}) {
  if (!isISODate(d)) return '';
  const [y, m, dd] = d.split('-').map(Number);
  let s = (o.short ? JOURS_C : JOURS)[weekday(d)] + ' ' + (dd === 1 ? '1er' : dd) + ' ' + MOIS[m - 1];
  if (o.year) s += ' ' + y;
  if (o.cap) s = s[0].toUpperCase() + s.slice(1);
  return s;
}
function fmtDateNum(d) { if (!isISODate(d)) return ''; const [y, m, dd] = d.split('-'); return dd + '/' + m + '/' + y; }
function fmtRange(a, b) {
  if (!isISODate(a) || !isISODate(b)) return '';
  const [ya, ma, da] = a.split('-').map(Number), [yb, mb, db] = b.split('-').map(Number);
  if (ya === yb && ma === mb) return da + ' → ' + db + ' ' + MOIS[mb - 1] + ' ' + yb;
  if (ya === yb) return da + ' ' + MOIS[ma - 1] + ' → ' + db + ' ' + MOIS[mb - 1] + ' ' + yb;
  return fmtDateNum(a) + ' → ' + fmtDateNum(b);
}
function localISO(date = new Date()) { return date.getFullYear() + '-' + pad2(date.getMonth() + 1) + '-' + pad2(date.getDate()); }
function hm2min(s) { if (!s || !/^\d{1,2}:\d{2}$/.test(s)) return null; const [h, m] = s.split(':').map(Number); return h * 60 + m; }
function min2hm(m) { if (m == null) return ''; const d = Math.floor(m / 1440); const r = ((m % 1440) + 1440) % 1440; return pad2(Math.floor(r / 60)) + ':' + pad2(r % 60) + (d > 0 ? ' (+' + d + ' j)' : ''); }
function fmtDur(min) {
  if (min == null || Number.isNaN(min)) return '';
  min = Math.round(min);
  if (min < 60) return min + ' min';
  const h = Math.floor(min / 60), m = min % 60;
  return h + ' h' + (m ? ' ' + pad2(m) : '');
}

/* ---------- 1.3 Âges et voyageurs (règles basées sur l'âge, jamais sur les prénoms) ---------- */
function ageOn(birth, date) {
  if (!isISODate(birth) || !isISODate(date)) return null;
  const [by, bm, bd] = birth.split('-').map(Number), [y, m, d] = date.split('-').map(Number);
  let a = y - by; if (m < bm || (m === bm && d < bd)) a--; return a;
}
function youngestAge(travelers, date) {
  let best = null;
  for (const t of travelers) { const a = ageOn(t.birth, date); if (a != null && (best == null || a < best)) best = a; }
  return best;
}
function isLeap(y) { return (y % 4 === 0 && y % 100 !== 0) || y % 400 === 0; }
/* Anniversaires tombant pendant le voyage */
function birthdaysInRange(travelers, start, end) {
  const out = [];
  if (!isISODate(start) || !isISODate(end)) return out;
  const y0 = +start.slice(0, 4), y1 = +end.slice(0, 4);
  for (const t of travelers) {
    if (!isISODate(t.birth)) continue;
    let [, bm, bd] = t.birth.split('-');
    for (let y = y0; y <= y1; y++) {
      let md = bm + '-' + bd;
      if (md === '02-29' && !isLeap(y)) md = '02-28';
      const d = y + '-' + md;
      if (d >= start && d <= end) out.push({ traveler: t, date: d, age: ageOn(t.birth, d) });
    }
  }
  return out;
}
/* Coût d'une étape pour les voyageurs présents, selon leur âge ce jour-là (centimes) */
function stepCost(step, travelers, date, settings = DEFAULT_SETTINGS) {
  const p = step.prix || {};
  if (p.forfait != null) return p.forfait;
  if (p.adulte == null && p.enfant == null) return null;
  let tot = 0;
  for (const t of travelers) {
    const age = ageOn(t.birth, date);
    if (age != null && p.gratuitSousAge != null && age < p.gratuitSousAge) continue;
    const enfMax = p.ageEnfantMax ?? settings.ageEnfantDefaut;
    if (age != null && p.enfant != null && age <= enfMax) { tot += p.enfant; continue; }
    tot += p.adulte ?? p.enfant ?? 0;
  }
  return tot;
}

/* ---------- 1.4 Argent : centimes entiers, partages exacts, soldes, remboursements ---------- */
/* Partage équitable : la somme des parts vaut toujours exactement le montant.

    for (const t of terms) {

      else if (t.length <= 3 && a.code.startsWith(t)) sc = 600;
      else if (a.f && a.f.startsWith(t)) sc = 450;
      else if (a.c.startsWith(t)) sc = 400;

    if (t > limite) alerts.push({ type: 'vol', msg: 'Journée trop chargée : il faudrait être à l\'aéroport (voiture rendue) à ' + min2hm(limite + s.retourVoitureMin) });
  } else items.push({ kind: 'fin', time: t, label: 'Retour ' + (ctx.lodgingEnd ? '· ' + ctx.lodgingEnd : 'au logement') });

  }

async function mapImage(points, segments, W = 900, H = 560) {

    if (!all.length) throw new Error('vide');
    const lat0 = Math.min(...all.map(p => p[0])), lat1 = Math.max(...all.map(p => p[0])), lon0 = Math.min(...all.map(p => p[1])), lon1 = Math.max(...all.map(p => p[1]));

    const [ax, ay] = proj(lat1, lon0, z), [bx, by] = proj(lat0, lon1, z);

    const tiles = [];
    for (let tx = Math.floor(cx / 256); tx <= Math.floor((cx + W) / 256); tx++) for (let ty = Math.floor(cy / 256); ty <= Math.floor((cy + H) / 256); ty++) tiles.push([tx, ty]);
    if (tiles.length > 30) throw new Error('trop de tuiles');

    const P = (lat, lon) => { const [x, y] = proj(lat, lon, z); return [x - cx, y - cy]; };

    return c.toDataURL('image/png'); // lève une erreur si les tuiles ne sont pas capturables (CORS)
  } catch (e) {
    return vectorMapCanvas(points, segments, W, H, { light: true, dpr: 1, labels: true }).toDataURL('image/png');
  }
}

async function compressImage(file, maxSide = 1600, quality = 0.72) {

/* ---------- Analyse directe par Claude (facultatif : clé API Anthropic gardée sur cet appareil) ----------

    const c = document.createElement('canvas'); c.width = Math.round(bmp.width * k); c.height = Math.round(bmp.height * k);

  const key = LS.get('anthropicKey', ''); if (!key) throw new Error('aucune clé API dans les Réglages');

  const wrap = i.closest('.ac'), box = wrap.querySelector('.ac-list');
  if (e.key === 'Escape') { acClose(wrap); return; }
  if (e.key === 'Enter' && !box.hidden) { const b = box.querySelector('.ac-item.on') || box.querySelector('.ac-item'); if (b) { e.preventDefault(); acPickCode(wrap, b.dataset.code); } }
  if ((e.key === 'ArrowDown' || e.key === 'ArrowUp') && !box.hidden) {
    const items = [...box.querySelectorAll('.ac-item')]; if (!items.length) return; e.preventDefault();
    let k = items.findIndex(x => x.classList.contains('on')); items.forEach(x => x.classList.remove('on'));
    k = (k + (e.key === 'ArrowDown' ? 1 : -1) + items.length) % items.length; items[k].classList.add('on'); items[k].scrollIntoView({ block: 'nearest' });
  }
});
document.addEventListener('focusout', e => {
  const i = e.target.closest && e.target.closest('.ac input'); if (!i) return;
  setTimeout(() => {
    const wrap = i.closest('.ac'); if (!wrap || wrap.contains(document.activeElement)) return;
    const v = i.value.trim();
    if (/^[A-Za-z]{3}$/.test(v)) { if (v !== v.toUpperCase()) i.value = v.toUpperCase(); wrap.querySelector('.ac-hint').textContent = airportHint(i.value); }
    acClose(wrap);

});

FORMS.newTrip = async (f, fd) => {
  const d0 = fv(fd, 'dateStart'), d1 = fv(fd, 'dateEnd');
  if (!isISODate(d0) || !isISODate(d1) || d1 < d0) { toast('Dates invalides'); return; }
  const id = newId(20);
  const gouts = Object.fromEntries(GOUTS.map(g => [g.k, fd.get('g_' + g.k) === 'on']));
  const trip = { name: fv(fd, 'name'), emoji: fv(fd, 'emoji'), destination: fv(fd, 'destination'), dateStart: d0, dateEnd: d1, currency: fv(fd, 'currency') || 'EUR', gouts, settings: {}, inviteToken: newId(24), archived: false, schema: 1, createdAt: Date.now(), jourJ: { home: LS.get('home', null) } };
  const docs = { travelers: {}, bookings: {} };
  const fam = LS.get('famille', []); let order = 0;
  fam.forEach((p, i) => { if (fd.get('fam' + i) === 'on') docs.travelers['t' + newId(10)] = { name: p.name, birth: p.birth || '', participe: p.participe !== false, famille: p.famille || '', order: order++ }; });
  for (const line of fv(fd, 'guests').split('\n')) { const [n, b] = line.split(',').map(x => (x || '').trim()); if (n) docs.travelers['t' + newId(10)] = { name: n, birth: isISODate(b) ? b : '', participe: true, famille: 'Invités', order: order++ }; }
  await AirportDB.load().catch(() => { });
  const from = await resolveAirport(fv(fd, 'fromAirport')), to = await resolveAirport(fv(fd, 'toAirport'));
  const comp = fv(fd, 'compagnie');
  if (fv(fd, 'allerDep') || fv(fd, 'allerNum')) docs.bookings['b' + newId(10)] = { type: 'vol', sens: 'aller', compagnie: comp, numero: fv(fd, 'allerNum'), from, to, fromTz: airportTz(from), toTz: airportTz(to), depDate: d0, depTime: fv(fd, 'allerDep'), arrDate: d0, arrTime: fv(fd, 'allerArr'), aVerifier: [] };
  if (fv(fd, 'retourDep') || fv(fd, 'retourNum')) docs.bookings['b' + newId(10)] = { type: 'vol', sens: 'retour', compagnie: comp, numero: fv(fd, 'retourNum'), from: to, to: from, fromTz: airportTz(to), toTz: airportTz(from), depDate: d1, depTime: fv(fd, 'retourDep'), arrDate: d1, arrTime: fv(fd, 'retourArr'), aVerifier: [] };
  const where = fd.get('where') === 'cloud' && Cloud.ready ? 'cloud' : 'local';
  const meFam = fam.findIndex(p => norm(p.name) === norm(LS.get('myName', '')));
  await saveNewTrip(id, trip, docs, where);
  if (meFam >= 0) { const tid = Object.entries(docs.travelers).find(([, v]) => norm(v.name) === norm(fam[meFam].name)); if (tid) { if (where === 'local') LS.set('me.' + id, tid[0]); else App.pendingMe = { trip: id, traveler: tid[0] }; } }
  toast('Voyage créé');
  go('#/v/' + where + '/' + id + '/programme');
};

async function saveNewTrip(id, trip, docs, where) {
  if (where === 'cloud') {
    await Cloud.createTrip({ ...trip, id }, docs, { meName: LS.get('myName', '') });
  } else {
    const ops = [{ coll: '', id, set: trip }];
    for (const [c, items] of Object.entries(docs)) for (const [k, v] of Object.entries(items)) ops.push({ coll: c, id: k, set: v, noHistory: true });
    await Local.commit(id, ops, {});
    await refreshLocalTrips();
  }
}
function familyTravelers() {
  const out = {}; LS.get('famille', []).forEach((p, i) => { out['t' + newId(10)] = { name: p.name, birth: p.birth || '', participe: p.participe !== false, famille: p.famille || '', order: i }; }); return out;
}

function dayDetail(d) {

    '<div class="row small">' + ic('home', 's') + '<span>' + esc((i.lStart && i.lStart.name) || arrTxt || 'Logement ?') + ' → ' + esc((i.lEnd && i.lEnd.name) || depTxt || 'Logement ?') + '</span></div>' +
    flightRows(i) +
    '<div class="row small">' + ic('sun', 's') + (w ? '<span>' + esc(meteoLabel(w.code)) + ' · ' + Math.round(w.tmin) + '–' + Math.round(w.tmax) + ' °C' + (w.vent != null ? ' · vent ' + Math.round(w.vent) + ' km/h' : '') + (w.pluie != null ? ' · pluie ' + w.pluie + ' %' : '') + ' <span class="muted">· Open-Meteo</span></span>' : '<span class="muted">Météo : disponible environ 2 semaines avant</span>') + '<button class="btn sm ghost noprint" data-act="fetchWeather" data-d="' + d + '">Actualiser</button></div>' +

function flightRows(i) {

ACT.scrollTo = el => { const t = document.getElementById(el.dataset.t); if (t) t.scrollIntoView({ behavior: 'smooth', block: 'start' }); };

/* ---------- (b) Programme minuté ---------- */
function stepPointsForDay(i) {
  const pts = []; const start = pointOf(i.lStart); if (start) pts.push({ ...start, home: true, label: i.lStart.name || 'Logement' });
  let n = 0; for (const s of activeSteps(i.steps)) { n++; const p = pointOf(s); if (p) pts.push({ ...p, n, rating: s.rating, label: s.name, id: s.id, hasRoute: !!(s.route && s.route.geometry) }); }
  const end = pointOf(i.lEnd); if (end) pts.push({ ...end, home: true, label: i.lEnd.name || 'Logement', hasRoute: !!(i.day.retour && i.day.retour.geometry) });
  return pts;
}
function timelineCard(d, i, s) {
  const pts = stepPointsForDay(i);
  const prevPoint = st => { let prev = pointOf(i.lStart); for (const x of activeSteps(i.steps)) { if (x.id === st.id) return prev; const p = pointOf(x); if (p) prev = p; } return prev; };
  const links = gmapsLinks(pts);
  const missing = activeSteps(i.steps).filter(x => !pointOf(x)).length;
  let html = '<section class="card stack" id="sec-h-' + d + '" aria-label="Programme minuté"><div class="sec-h" style="margin:0"><h2 class="lbl">Programme minuté</h2><button class="btn sm ghost noprint" data-act="editStart" data-d="' + d + '">Départ ' + esc(i.day.startTime || s.debutJournee) + '</button></div><div class="tl">';
  for (const it of i.tl.items) {
    if (it.kind === 'route') {
      const target = it.retour ? pointOf(i.lEnd) : pointOf(it.to);
      const from = it.retour ? (() => { let p = pointOf(i.lStart); for (const x of activeSteps(i.steps)) { const q = pointOf(x); if (q) p = q; } return p; })() : prevPoint(it.to);
      const maps = target ? '<a class="maps noprint" target="_blank" rel="noopener" href="' + (from ? gmapsLinks([from, target])[0].url : 'https://www.google.com/maps/dir/?api=1&destination=' + ll(target)) + '">Maps ↗</a>' : '';
      html += '<div class="tl-route">' + ic('car', 's') + (it.min != null ? '<span>' + fmtDur(it.minMarge) + (it.est ? ' <span class="tiny">(' + fmtDur(it.min) + ' estimé sans trafic + ' + s.margeTrajet + ' %)</span>' : ' <span class="tiny">(saisi)</span>') + '</span>' : '<span class="tiny">trajet non estimé</span>') +
        (it.km ? '<span>· ' + it.km + ' km</span>' : '') + (it.note ? '<span>· ' + esc(it.note) + '</span>' : '') + (it.duringNap ? '<span class="chip infoc" style="font-size:11px">pendant la sieste</span>' : '') + (it.retour ? '<span>· retour</span>' : '') + maps + '</div>';
    } else if (it.kind === 'step') {
      const st = it.step;
      html += '<div class="tl-row"><span class="tl-time">' + min2hm(it.time) + '</span><span><a href="#" data-act="editStep" data-id="' + esc(st.id) + '" style="color:inherit;text-decoration:none;font-weight:600">' + esc(st.name) + '</a> ' + (st.rating ? ratingBadge(st.rating, true) : '') +
        '<br><span class="small muted">' + esc((STEP_TYPE[st.type] || {}).l || '') + (it.dur ? ' · ' + fmtDur(it.dur) + (it.durDefaut ? ' (durée par défaut)' : '') : '') + (st.heureFixe ? ' · heure fixe ' + esc(st.heureFixe) : '') + '</span>' +
        (st.statut && st.statut !== 'prevu' ? ' <span class="chip ' + (st.statut === 'fait' ? 'okc' : 'warnc') + '" style="font-size:11px">' + esc(STATUT[st.statut].l) + '</span>' : '') + '</span></div>';
    } else if (it.kind === 'bloc') {
      html += '<div class="tl-block' + (it.type === 'repas' ? ' warn' : '') + '">' + ic(it.type === 'sieste' ? 'moon' : 'food', 's') + ' ' + min2hm(it.time) + (it.end ? ' – ' + min2hm(it.end) : '') + ' · ' + esc(it.label) + '</div>';
    } else {
      html += '<div class="tl-row" style="margin:4px 0"><span class="tl-time">' + min2hm(it.time) + '</span><span>' + (it.kind === 'vol' ? ic('plane', 's') + ' ' : '') + esc(it.label) + '</span></div>';
    }
  }
  html += '</div>' + i.tl.alerts.map(a => '<div class="banner">' + ic('warn') + '<span>' + esc(a.msg) + '</span></div>').join('');
  if (!i.steps.length) html += '<p class="small muted" style="margin:0">Aucune étape. Ajoute-en une, ou génère le programme avec Claude.</p>';
  html += '<div class="grid2 noprint">' + (links.length ? '<button class="btn primary" data-act="gmapsDay" data-d="' + d + '">' + ic('pin') + 'Journée dans Maps' + (links.length > 1 ? ' · ' + links.length + ' liens' : '') + '</button>' : '') +
    '<button class="btn" data-act="routesDay" data-d="' + d + '">' + ic('refresh') + 'Temps de route</button></div>' +
    (missing ? '<p class="tiny muted" style="margin:0">' + missing + ' étape(s) sans position : touche une étape puis « Trouver sur la carte » pour calculer les trajets.</p>' : '') +
    '<p class="tiny muted" style="margin:0">Durées estimées par OSRM (données OpenStreetMap), sans trafic, + marge famille. Ce ne sont pas des temps Google.</p></section>';
  return html;
}
ACT.gmapsDay = el => {

/* Calcul des temps de route (en cache dans le voyage → consultables hors ligne) */
const _routing = {};
async function recomputeRoutes(d, force) {
  const tid = T.id, key = tid + '/' + d;
  if (!T.trip || _routing[key] || !navigator.onLine) return 0;
  _routing[key] = true;
  try {
    const i = dayInfo(d); let prev = pointOf(i.lStart); let n = 0;
    const same = (a, b) => a && b && Math.abs(a[0] - b.lat) < 1e-4 && Math.abs(a[1] - b.lon) < 1e-4;
    for (const st of activeSteps(i.steps)) {
      const p = pointOf(st);
      if (prev && p) {
        const r = st.route || {};
        if (force || r.minutes == null || !same(r.from, prev) || !same(r.to, p)) {
          const res = await routeBetween(prev, p);
          if (T.id !== tid) return n;
          if (res) { n++; await write([{ coll: 'steps', id: st.id, patch: { route: { ...r, ...res, to: [p.lat, p.lon] } }, noHistory: true }], { trip: tid }); }
        }
      }
      if (p) prev = p;
    }
    const end = pointOf(i.lEnd);
    if (prev && end && !(prev.lat === end.lat && prev.lon === end.lon)) {
      const r = (T.days[d] || {}).retour || {};
      if (force || r.minutes == null || !same(r.from, prev) || !same(r.to, end)) { const res = await routeBetween(prev, end); if (res && T.id === tid) { n++; await write([{ coll: 'days', id: d, patch: { retour: { ...res, to: [end.lat, end.lon] } }, noHistory: true }], { trip: tid }); } }
    }
    return n;
  } finally { _routing[key] = false; }
}
ACT.routesDay = async el => { if (!navigator.onLine) { toast('Hors ligne : temps de route enregistrés affichés'); return; } toast('Calcul des trajets…'); const n = await recomputeRoutes(el.dataset.d, true); toast(n ? n + ' trajet(s) calculé(s)' : 'Rien à calculer : localise d\'abord les étapes'); };
ACT.fetchWeather = async el => { const ok = await fetchDayWeather(el.dataset.d, true); toast(ok ? 'Météo mise à jour' : 'Météo indisponible (date trop lointaine, hors ligne ou lieu inconnu)'); };
async function fetchDayWeather(d, force) {
  if (!navigator.onLine || !T.trip) return false;
  const tid = T.id;
  const i = dayInfo(d); const today = localISO();
  if (d < today || daysBetween(today, d) > 15) return false;
  const w = i.day.weather; if (!force && w && Date.now() - w.at < 6 * 3600e3) return false;
  const p = pointOf(i.lEnd) || pointOf(i.lStart) || activeSteps(i.steps).map(pointOf).find(Boolean); if (!p) return false;
  try { const res = await weatherFor(p.lat, p.lon, d, d); if (res[d] && T.id === tid) { await write([{ coll: 'days', id: d, patch: { weather: res[d] }, noHistory: true }], { trip: tid }); return true; } } catch (e) { console.warn(e); }
  return false;
}
function afterDay(d) {
  // Carte, glisser-déposer, calculs automatiques en arrière-plan
  const el = document.getElementById('map-' + d);
  if (el && el.offsetParent) { const i = dayInfo(d); drawMap(el, stepPointsForDay(i), [...activeSteps(i.steps).map(s => s.route && s.route.geometry).filter(Boolean), i.day.retour && i.day.retour.geometry].filter(Boolean)); }
  enableDrag(d);
  const i = dayInfo(d);
  const stale = activeSteps(i.steps).some((s, k) => pointOf(s) && (!s.route || s.route.minutes == null)) || (pointOf(i.lEnd) && !(i.day.retour && i.day.retour.minutes != null) && activeSteps(i.steps).some(pointOf));
  const tid = T.id; const still = () => T.id === tid && T.trip;
  if (stale && navigator.onLine) setTimeout(() => { if (still()) recomputeRoutes(d); }, 300);
  if (!i.day.weather || Date.now() - (i.day.weather.at || 0) > 6 * 3600e3) setTimeout(() => { if (still()) fetchDayWeather(d); }, 500);
}

  const ex = st.exposition || {}; const exl = [ex.soleil && 'soleil', ex.ombre && 'ombre', ex.vent && 'vent', ex.altitude && 'altitude'].filter(Boolean); if (exl.length) c.push('Exposition : ' + exl.join(', '));

/* Glisser-déposer tactile (poignée) pour réordonner les étapes du jour */
function enableDrag(d) {
  const box = document.getElementById('steps-' + d); if (!box) return;
  for (const h of box.querySelectorAll('.handle')) {
    h.onpointerdown = ev => {
      const card = h.closest('[data-step]'); if (!card) return;
      ev.preventDefault(); h.setPointerCapture(ev.pointerId);
      const cards = [...box.querySelectorAll('[data-step]')];
      const startY = ev.clientY; const rect = card.getBoundingClientRect();
      const ph = document.createElement('div'); ph.className = 'drop-ph'; ph.style.height = rect.height + 'px';
      card.classList.add('dragging'); card.after(ph);
      let target = cards.indexOf(card);
      const move = e => {
        const dy = e.clientY - startY; card.style.transform = 'translateY(' + dy + 'px)';
        const y = e.clientY; let idx = 0;
        const others = cards.filter(c => c !== card);
        for (const c of others) { const r = c.getBoundingClientRect(); if (y > r.top + r.height / 2) idx++; }
        target = idx;
        const ref = others[idx]; if (ref) ref.before(ph); else box.appendChild(ph);
        if (e.clientY < 60) scrollBy(0, -12); else if (e.clientY > innerHeight - 100) scrollBy(0, 12);
      };
      const up = () => {
        h.removeEventListener('pointermove', move); h.removeEventListener('pointerup', up); h.removeEventListener('pointercancel', up);
        card.classList.remove('dragging'); card.style.transform = ''; ph.remove();
        const ids = cards.map(c => c.dataset.step).filter(id => id !== card.dataset.step);
        const all = stepsOn(d).filter(s => ids.includes(s.id));
        const before = all[target - 1], after = all[target];
        const st = T.steps[card.dataset.step];
        const newOrder = orderBetween(before ? before.order : null, after ? after.order : null);
        if (st && newOrder !== st.order) write([{ coll: 'steps', id: st.id, patch: { order: newOrder } }]);
      };
      h.addEventListener('pointermove', move); h.addEventListener('pointerup', up); h.addEventListener('pointercancel', up);
    };
  }
}

      '<div class="grid2"><div class="stat" style="text-align:left;padding:10px"><span>Départ conseillé</span><b style="font-size:22px">' + (routeItem ? min2hm(routeItem.time) : nextItem ? min2hm(nextItem.time) : '—') + '</b></div><div class="stat" style="text-align:left;padding:10px"><span>Trajet</span><b style="font-size:22px">' + (routeItem && routeItem.min != null ? fmtDur(routeItem.minMarge) : '—') + '</b><span>' + (routeItem && routeItem.est ? 'estimé, sans trafic' : routeItem && routeItem.min != null ? 'saisi' : '') + '</span></div></div>' +

TRIP_VIEWS.depenses = () => {
  const cur = T.trip.currency || 'EUR';
  const all = live('expenses');
  const me = meTravelerId();
  const fl = App.ui.exp || (App.ui.exp = { q: '', cat: '', who: '', date: '' });
  const q = norm(fl.q);
  const list = all.filter(e => (!q || norm(e.title + ' ' + (e.note || '')).includes(q)) && (!fl.cat || e.category === fl.cat) && (!fl.who || e.paidBy === fl.who || (e.shares || {})[fl.who] != null) && (!fl.date || e.date === fl.date))
    .sort((a, b) => String(b.date).localeCompare(String(a.date)) || (b.createdAt || b.updatedAt || 0) - (a.createdAt || a.updatedAt || 0));
  const groups = {}; for (const e of list) (groups[e.date] = groups[e.date] || []).push(e);
  const dates = [...new Set(all.map(e => e.date))].sort().reverse();
  const row = e => {
    const transfer = e.type === 'transfert';
    const sub = transfer ? esc(travelerName(e.paidBy)) + ' → ' + esc(travelerName(e.to)) : e.paidBy ? (e.type === 'revenu' ? 'Reçu par ' : 'Payé par ') + '<b style="color:var(--text);font-weight:500">' + esc(travelerName(e.paidBy) + (e.paidBy === me ? ' (moi)' : '')) + '</b>' : esc((CAT[e.category] || CAT.divers).l);
    return '<button class="item" data-act="editExpense" data-id="' + esc(e.id) + '">' + (transfer ? '<span class="cat" style="background:var(--card2);color:var(--muted)">' + ic('swap') + '</span>' : catIcon(e.category)) +
      '<span class="grow"><span class="t" style="display:block">' + esc(e.title) + (e.photoId ? ' ' + ic('camera', 's') : '') + '</span><span class="s">' + sub + (e.currency && e.currency !== cur ? ' · ' + fmtMoney(e.amount, e.currency) : '') + (e.split && e.split.mode === 'aucun' && !T.trip.archived ? ' · non partagée' : '') + '</span></span>' +

function efRead() {
  const f = $('#ef'); if (!f) return null;
  const fd = new FormData(f); const trav = travelersSorted(); const cur = T.trip.currency || 'EUR';
  const type = fd.get('type'); const amount = parseAmount(fv(fd, 'amount')); const currency = fv(fd, 'currency') || cur;
  const rate = currency === cur ? 1 : (parseFloat(fv(fd, 'rate').replace(',', '.')) || null);
  const mode = fv(fd, 'mode') || 'egal';
  const parts = trav.filter(t => fd.get('p_' + t.id) === 'on').map(t => t.id);
  const split = { mode, participants: parts };
  if (mode === 'parts') split.parts = Object.fromEntries(parts.map(id => [id, parseFloat(fv(fd, 'w_' + id).replace(',', '.')) || 0]));
  if (mode === 'montants') split.amounts = Object.fromEntries(parts.map(id => [id, parseAmount(fv(fd, 'w_' + id)) || 0]));
  const e = { type, title: fv(fd, 'title'), category: fv(fd, 'category'), amount, currency, rate, amountTrip: amount != null && rate ? convert(amount, rate) : null, paidBy: fv(fd, 'paidBy'), to: type === 'transfert' ? fv(fd, 'to') : null, date: fv(fd, 'date'), split, note: fv(fd, 'note'), photoId: fv(fd, 'photoId') || null, rateSource: fv(fd, 'rateSource') };
  if (e.amountTrip != null && type !== 'transfert') e.shares = computeShares(e, trav.map(t => t.id));
  return e;
}
function efRecalc() {
  const e = efRead(); if (!e) return; const cur = T.trip.currency || 'EUR';
  $$('.efw').forEach(i => i.style.display = (e.split.mode === 'parts' || e.split.mode === 'montants') ? '' : 'none');
  $$('.efs').forEach(s => { const v = (e.shares || {})[s.dataset.t]; s.textContent = v != null ? fmtMoney(v, cur) : ''; });
  const chk = $('#efCheck'); if (!chk) return;
  if (e.split.mode === 'montants' && e.amount != null) { const sum = sumValues(e.split.amounts); const rest = e.amount - sum; chk.innerHTML = rest === 0 ? '<span class="pos">Les montants tombent juste.</span>' : '<span class="neg">Reste à répartir : ' + fmtSigned(rest, e.currency) + '</span>'; }
  else if (e.amountTrip != null && e.shares) chk.innerHTML = '<span class="muted">Total des parts : ' + fmtMoney(sumValues(e.shares), cur) + (e.currency !== cur ? ' (converti au taux ' + esc(String(e.rate || '?')) + ')' : '') + '</span>';
  else chk.textContent = '';
}
INP.efRecalc = () => efRecalc();

ACT.efRate = async () => {
  const f = $('#ef'); const from = f.currency.value, to = T.trip.currency || 'EUR';
  if (!navigator.onLine) { toast('Hors ligne : saisis le taux à la main'); return; }

  f.rate.value = String(r.rate).replace('.', ','); f.rateSource.value = r.source; efRecalc(); toast('Taux ' + r.source + ' : vérifie-le, ce n\'est pas le taux de ta banque', 4000);

FORMS.saveExpense = (f, fd) => {

};

/* =====================================================================

function budgetData() {
  return memo('budget', () => {
    const prev = budgetPrevu({ steps: live('steps'), bookings: live('bookings'), travelers: travelersSorted(), manuel: T.trip.budgetManuel || {}, jourJ: jourJCalc(), settings: settingsOf() });
    const reel = budgetReel(live('expenses'));
    return { prev, reel };
  });
}
TRIP_VIEWS.budget = () => {
  const cur = T.trip.currency || 'EUR'; const { prev, reel } = budgetData();
  const arch = !!T.trip.archived;
  const tp = arch ? 0 : sumBudget(prev.b), tr = sumBudget(reel);
  const st = computeStats();
  const max = Math.max(1, ...CATEGORIES.map(c => Math.max(arch ? 0 : prev.b[c.k], reel[c.k])));
  const rows = CATEGORIES.filter(c => reel[c.k] || (!arch && prev.b[c.k]) || !arch).sort((a, b) => (reel[b.k] + (arch ? 0 : prev.b[b.k])) - (reel[a.k] + (arch ? 0 : prev.b[a.k])));
  const head = arch ? '<tr><th>Catégorie</th><th class="n">Réel</th></tr>' : '<tr><th>Catégorie</th><th class="n">Prévu</th><th class="n">Réel</th><th class="n">Écart</th></tr>';
  const line = c => { const p = prev.b[c.k], r = reel[c.k], d = r - p;
    const name = '<td><button style="border:0;background:none;color:inherit;padding:0;text-align:left;cursor:pointer" data-act="budgetCat" data-k="' + c.k + '">' + esc(c.l) + '</button><div class="bar" style="margin-top:6px;height:6px"><i style="width:' + Math.round(100 * r / max) + '%"></i></div></td>';
    const real = '<td class="n"><b>' + (r ? fmtMoneyShort(r, cur) : '<span class="muted">—</span>') + '</b></td>';
    return '<tr>' + name + (arch ? real : '<td class="n">' + (p ? fmtMoneyShort(p, cur) : '<span class="muted">—</span>') + '</td>' + real + '<td class="n ' + (p && d > 0 ? 'neg' : p && d < 0 ? 'pos' : '') + '">' + (p ? fmtSigned(d, cur) : '') + '</td>') + '</tr>'; };
  const total = arch ? '<tr><td><b>Total</b></td><td class="n"><b>' + fmtMoneyShort(tr, cur) + '</b></td></tr>' : '<tr><td><b>Total</b></td><td class="n"><b>' + (tp ? fmtMoneyShort(tp, cur) : '—') + '</b></td><td class="n"><b>' + fmtMoneyShort(tr, cur) + '</b></td><td class="n">' + (tp ? fmtSigned(tr - tp, cur) : '') + '</td></tr>';
  return topbar('Budget', T.trip.name, { back: '#/' }) + backupReminder() + '<div class="seg" role="tablist" style="margin-bottom:12px"><a href="' + tripUrl('budget') + '" aria-selected="true">' + (arch ? 'Budget' : 'Prévu / réel') + '</a><a href="' + tripUrl('recap') + '" aria-selected="false">Récap</a></div><div class="stack">' +
    '<section class="card stack"><div class="row" style="align-items:baseline;flex-wrap:wrap"><span style="font-size:30px;font-weight:700">' + fmtMoney(tr, cur) + '</span><span class="small muted">' + (arch ? 'total calculé (archive)' : 'réel, total calculé') + '</span></div>' +
    (tp ? '<div class="small">Prévu : <b>' + fmtMoney(tp, cur) + '</b> · écart <b class="' + (tr - tp > 0 ? 'neg' : 'pos') + '">' + fmtSigned(tr - tp, cur) + '</b></div>' : '') +
    '<div class="stats"><div class="stat"><b>' + fmtMoneyShort(st.perDay, cur) + '</b><span>par jour</span></div><div class="stat"><b>' + fmtMoneyShort(st.perPerson, cur) + '</b><span>par personne</span></div><div class="stat"><b>' + st.days + ' j</b><span>' + st.travelers + ' voyageurs</span></div></div></section>' +
    '<section class="card"><table class="table"><thead>' + head + '</thead><tbody>' + rows.map(line).join('') + total + '</tbody></table>' +
    '<p class="tiny muted" style="margin:8px 0 0">' + (arch ? 'Voyage archivé : dépenses reprises pour information. Le total est toujours recalculé à partir des lignes.' : 'Prévu = prix des étapes selon l\'âge de chacun + réservations + trajet domicile-aéroport estimé + tes saisies (touche une catégorie). Réel = dépenses. Les totaux sont toujours calculés.') + '</p></section></div>';
};

    '<div class="stats"><div class="stat"><b>' + Math.round(km) + ' km</b><span>estimés</span></div><div class="stat"><b>' + fmtDur(route) + '</b><span>de route</span></div><div class="stat"><b>' + count('fait') + ' / ' + steps.filter(s => !s.deletedAt).length + '</b><span>étapes faites</span></div><div class="stat"><b>' + count('pas-le-temps') + '</b><span>pas eu le temps</span></div></div></section>' +
    recapOrganisation() +
    '<section class="card"><h2 class="lbl" style="margin-bottom:8px">Itinéraire</h2>' + days.map(d => { const i = dayInfo(d); return '<div style="padding:6px 0;border-top:1px solid var(--line)"><b>' + esc(fmtDay(d, { cap: true })) + '</b><div class="small muted">' + esc(activeSteps(i.steps).map(s => s.name + (s.statut === 'fait' ? ' ✓' : s.statut === 'pas-le-temps' ? ' (pas eu le temps)' : '')).join(' · ') || '—') + '</div></div>'; }).join('') + '</section>' +
    '<section class="card"><h2 class="lbl" style="margin-bottom:8px">Top des +++</h2>' + (top.length ? top.map(s => '<div class="row small" style="padding:4px 0">' + ratingBadge(3, true) + '<span class="grow">' + esc(s.name) + '</span><span class="muted">' + esc(fmtDay(s.date, { short: true })) + '</span></div>').join('') : '<p class="small muted" style="margin:0">Aucune étape +++.</p>') + '</section>' +
    '<section class="card"><h2 class="lbl" style="margin-bottom:8px">Budget par catégorie</h2>' + CATEGORIES.filter(c => reel[c.k] || prev.b[c.k]).map(c => '<div class="row small" style="padding:5px 0;border-top:1px solid var(--line)"><span class="grow">' + esc(c.l) + '</span>' + (prev.b[c.k] ? '<span class="muted">prévu ' + fmtMoneyShort(prev.b[c.k], cur) + '</span>' : '') + '<b style="min-width:80px;text-align:right">' + fmtMoneyShort(reel[c.k], cur) + '</b></div>').join('') +
    '<div class="row" style="padding:8px 0;border-top:1px solid var(--line)"><b class="grow">Total</b><b>' + fmtMoneyShort(st.total, cur) + '</b></div><div class="small muted">' + fmtMoneyShort(st.perDay, cur) + ' par jour · ' + fmtMoneyShort(st.perPerson, cur) + ' par personne</div></section>' +
    (!T.trip.archived ? '<section class="card"><h2 class="lbl" style="margin-bottom:8px">Équilibre final</h2>' + (settl.length ? settl.map(s => '<div class="row small" style="padding:4px 0"><span class="grow">' + esc(travelerName(s.from)) + ' → ' + esc(travelerName(s.to)) + '</span><b>' + fmtMoney(s.amount, cur) + '</b></div>').join('') : '<p class="small" style="margin:0">Tout le monde est à l\'équilibre.</p>') + '</section>' : '') +
    '<section class="card stack"><h2 class="lbl">Notes</h2><form data-form="recapNotes" class="stack">' + field('Notes générales (reprises des documents)', '<textarea class="input" name="general" rows="' + Math.min(12, Math.max(3, String(notes.general || '').split('\n').length + 1)) + '">' + esc(notes.general || '') + '</textarea>') + field('À refaire', '<textarea class="input" name="refaire" rows="3">' + esc(notes.refaire || '') + '</textarea>') + field('À éviter', '<textarea class="input" name="eviter" rows="3">' + esc(notes.eviter || '') + '</textarea>') + '<button class="btn block noprint">Enregistrer les notes</button></form></section>' +

/* Organisation : vols, logements, voitures, parkings (réservations du voyage) */
function organisationLines() {
  const cur = T.trip.currency || 'EUR'; const bk = live('bookings');
  const price = b => b.prix ? ' · ' + fmtMoneyShort(b.prix, cur) : '';
  const L = (icn, title, sub) => ({ icn, title, sub });
  return [
    ...bk.filter(b => b.type === 'vol').sort((a, b) => String(a.depDate).localeCompare(b.depDate)).map(b => L('plane', (b.sens === 'retour' ? 'Retour ' : b.sens === 'aller' ? 'Aller ' : 'Vol ') + (b.from || '?') + ' → ' + (b.to || '?'), [b.depDate ? fmtDay(b.depDate, { short: true }) + (b.depTime ? ' ' + b.depTime : '') : '', [b.compagnie, b.numero].filter(Boolean).join(' '), b.ref ? 'réf. ' + b.ref : ''].filter(Boolean).join(' · ') + price(b))),
    ...bk.filter(b => b.type === 'logement').map(b => L('home', b.name || 'Logement', [b.checkin && b.checkout ? fmtRange(b.checkin, b.checkout) : '', b.address || ''].filter(Boolean).join(' · ') + price(b))),
    ...bk.filter(b => b.type === 'voiture').map(b => L('key', 'Voiture · ' + (b.loueur || 'location'), [b.priseDate ? 'prise ' + fmtDay(b.priseDate, { short: true }) + (b.priseTime ? ' ' + b.priseTime : '') : '', b.retourDate ? 'retour ' + fmtDay(b.retourDate, { short: true }) + (b.retourTime ? ' ' + b.retourTime : '') : ''].filter(Boolean).join(' · ') + price(b))),
    ...bk.filter(b => b.type === 'parking').map(b => L('parking', 'Parking · ' + (b.nom || ''), [b.terminal, b.navette].filter(Boolean).join(' · ') + price(b))),
  ];
}

}

function jourJCalc() {
  const t = T.trip; if (!t) return null;
  const j = t.jourJ || {}; const s = settingsOf();
  const fl = flights(); const out = fl.find(f => f.sens === 'aller') || fl[0]; const back = fl.find(f => f.sens === 'retour') || (fl.length > 1 ? fl[fl.length - 1] : null);
  const routeMin = j.routeManuel != null ? j.routeManuel : (j.route && j.route.minutes);
  const est = j.routeManuel == null;
  const trajet = routeMin != null ? (est ? Math.round(routeMin * (1 + s.margeTrajet / 100)) : routeMin) : null;
  const res = { routeMin, trajet, est, km: j.route ? j.route.km : (j.km || null), out, back };
  if (out && out.depTime && trajet != null) {
    const steps = [['Décollage', hm2min(out.depTime)], ['Arrivée à l\'aéroport (marge famille)', -s.margeAeroport], ['Navette ou marche depuis le parking', -(j.navetteMin ?? s.navetteMin)], ['Trajet' + (est ? ' (estimé + ' + s.margeTrajet + ' %)' : ' (saisi)'), -trajet], ['Pause enfants', -(j.pauseMin ?? s.pauseEnfants)]];
    let m = steps[0][1]; const items = [{ label: steps[0][0], time: m }];
    for (const [l, v] of steps.slice(1)) { m += v; items.push({ label: l, delta: v, time: m }); }
    res.aller = { items, depart: m, date: m < 0 ? addDays(out.depDate, -1) : out.depDate };
  }
  if (back && back.arrTime && trajet != null) {
    let m = hm2min(back.arrTime); const items = [{ label: 'Atterrissage', time: m }];
    for (const [l, v] of [['Bagages', s.bagagesMin], ['Navette jusqu\'au parking', j.navetteMin ?? s.navetteMin], ['Trajet', trajet]]) { m += v; items.push({ label: l, delta: v, time: m }); }
    res.retour = { items, arrivee: m, date: m >= 1440 ? addDays(back.arrDate, 1) : back.arrDate };
  }
  if (res.km && j.conso && j.prixEnergie) res.coutEnergie = Math.round(2 * res.km * (j.conso / 100) * j.prixEnergie * 100);
  res.peage = j.peage || 0;
  res.coutTotal = (res.coutEnergie || 0) + res.peage || null;
  return res;
}

    tripDays().map((d, k) => { const i = dayInfo(d); const td = tips.byDay[d] || { tips: [], routine: [] }; return '<section class="' + (k ? 'pagebreak ' : '') + 'stack" style="margin-top:16px"><h2 style="font-size:22px">' + esc(fmtDay(d, { cap: true })) + '</h2>' +
      '<div class="small muted">' + esc(((i.lStart && i.lStart.name) || '') + ' → ' + ((i.lEnd && i.lEnd.name) || '')) + ' · ' + (i.tl.km ? i.tl.km + ' km · ' : '') + (i.tl.routeMin ? fmtDur(i.tl.routeMin) + ' de route estimée · ' : '') + i.r3 + ' × +++</div>' + birthdayBanner(d) +
      '<div class="card"><table class="table">' + i.tl.items.map(it => it.kind === 'route' ? '<tr><td></td><td class="small muted">Route ' + (it.min != null ? fmtDur(it.minMarge) + (it.est ? ' estimé' : '') : '?') + (it.note ? ' · ' + esc(it.note) : '') + '</td></tr>' : '<tr><td style="width:60px"><b>' + min2hm(it.time) + '</b></td><td>' + esc(it.kind === 'step' ? it.step.name + (it.step.rating ? '  ' + RATING_TXT(it.step.rating) : '') + ' — ' + fmtDur(it.dur) : it.label) + '</td></tr>').join('') + '</table></div>' +
      '<div class="card"><b>Activités cotées</b>' + i.steps.map(s => '<div style="padding:4px 0"><b>' + (RATING_TXT(s.rating) || '·') + '</b> ' + esc(s.name) + (s.alternatives || []).map(a => '<div class="small">Alternative : ' + esc(a.name) + ' ' + RATING_TXT(a.rating) + '</div>').join('') + (s.planB ? '<div class="small">Plan B : ' + esc(s.planB) + '</div>' : '') + '</div>').join('') + '</div>' +
      '<div class="card"><b>Conseils du jour</b>' + td.tips.map(x => '<div>☐ ' + esc(x.text) + '</div>').join('') + td.routine.map(x => '<div class="muted">☐ Routine : ' + esc(x.label) + '</div>').join('') + '</div>' +
      (stepPointsForDay(i).length ? '<div id="pmap-' + d + '"></div>' : '') + '</section>'; }).join('') +
    '<section class="pagebreak"><h2 style="font-size:22px">Checklist valise</h2>' + tips.routineRules.map(r => '<div>☐ ' + esc(r.text) + '</div>').join('') + live('checklist').filter(x => x.scope === 'valise').map(x => '<div>☐ ' + esc(x.text) + '</div>').join('') + '</section></article>';
};

/* =====================================================================
   14. DÉMARRAGE
   ===================================================================== */
function startCloudList() {
  if (App._stopCloudList || !Cloud.ready) return;
  App._stopCloudList = Cloud.watchTripList(list => { App.cloudTrips = list; App.tripsReady = true; if (['home', 'comparer'].includes(App.route.name)) scheduleRender(); });
}
async function onRoute() {
  const r = parseHash(); const prev = App.route; App.route = r;
  if (r.name === 'trip') {
    if (r.where === 'cloud' && !Cloud.ready) { const cfg = firebaseConfig(); if (cfg) { const ok = await Cloud.init(cfg); if (ok) startCloudList(); } }
    if (r.where === 'cloud' && !Cloud.ready) { resetT(); T.id = r.id; T.where = 'cloud'; T.loaded = true; T.trip = null; T.error = Cloud.error || new Error(firebaseConfig() ? 'connexion au cloud impossible (hors ligne au premier lancement ?)' : 'synchro cloud non configurée sur cet appareil'); }
    else await openTrip(r.id, r.where);
  }
  if (!prev || prev.name !== r.name || prev.view !== r.view || prev.arg !== r.arg || prev.id !== r.id) window.scrollTo(0, 0);
  render();
}
(async function boot() {
  applyTheme();
  window.addEventListener('hashchange', onRoute);
  window.addEventListener('online', () => scheduleRender());
  window.addEventListener('offline', () => scheduleRender());
  window.addEventListener('beforeinstallprompt', e => { e.preventDefault(); App.installEvt = e; scheduleRender(); });
  bus.addEventListener('local-change', () => refreshLocalTrips());
  try { await Local.init(); } catch (e) { console.error(e); toast('Stockage local indisponible : ' + e.message, 6000); }
  await refreshLocalTrips().catch(() => { });
  const cfg = firebaseConfig();
  const cloudP = cfg ? Cloud.init(cfg).then(ok => { if (ok) startCloudList(); scheduleRender(); }) : Promise.resolve();
  const h = parseHash();
  if ((h.name === 'trip' && h.where === 'cloud') || h.name === 'join') await cloudP;
  await onRoute();
  if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => { });
  if ('serviceWorker' in navigator && (location.protocol === 'https:' || ['localhost', '127.0.0.1'].includes(location.hostname))) navigator.serviceWorker.register('sw.js').catch(e => console.warn('Service worker', e));
  window.__carnet = { Core, T, App, Local, Cloud, write, openTrip, restoreBackup };
})();

</script>
